# ==============================================================================
# Nginx Master Configuration Override — Non-Root Security (UID 10001)
# ==============================================================================
#
# Context & Rationale:
#   By default, official Nginx Docker images run the master process as `root` (UID 0),
#   require permission to drop privileges via the `user nginx;` directive, write the
#   PID file to `/var/run/nginx.pid`, and write temp cache directories to `/var/cache/nginx/`.
#
#   Per Architecture Specification §6 and Rule 3 (Least Privilege), all containers in
#   this application execute strictly as unprivileged non-root UID 10001 (`appuser`).
#   Running the default Nginx configuration as non-root immediately crashes on startup
#   with "permission denied" errors when accessing `/var/run` and `/var/cache`.
#
#   This file adapts Nginx to run safely entirely within user-space:
#     1. Omits the privileged `user` directive.
#     2. Diverts the PID file and all client/proxy temp buffers to `/tmp/nginx/`.
#     3. Redirects logging directly to standard stdout/stderr for Docker log collectors.
# ==============================================================================

# Automatically tune worker threads to available CPU cores
worker_processes auto;

# Place PID file in unprivileged /tmp directory owned by UID 10001
pid /tmp/nginx.pid;

# Stream error logs directly to container stderr
error_log /dev/stderr notice;

events {
  # Maximum concurrent network connections per worker process
  worker_connections 1024;
}

http {
  # Standard MIME type mappings for CSS, JS, HTML, SVG, etc.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Stream access logs directly to container stdout for Docker daemon capture
  access_log /dev/stdout;

  # Temporary buffer directories relocated to user-writable /tmp paths
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Performance optimizations: zero-copy kernel file transfer and TCP keepalive
  sendfile on;
  keepalive_timeout 65;

  # Load the server block definition from conf.d (frontend/nginx.conf)
  include /etc/nginx/conf.d/*.conf;
}

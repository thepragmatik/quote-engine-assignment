# ==============================================================================
# Nginx Master Configuration Override — Non-Root Security (UID 10001)
# ==============================================================================
#
# Context & Rationale:
#   Official Nginx container images default to running as `root` (UID 0), writing
#   the process PID to `/var/run/nginx.pid` and caching temporary request buffers
#   to `/var/cache/nginx/`.
#
#   Per Architecture Specification §6 and Rule 3 (Least Privilege), this container
#   runs strictly as unprivileged non-root UID 10001 (`appuser`). Without this custom
#   override, Nginx crashes immediately on container boot with "Permission Denied".
#
# Specific Adaptations (Zero Fluff):
#   1. Omit the privileged `user` directive (master process is already UID 10001).
#   2. Relocate PID file and active temp buffers to `/tmp/nginx/` (owned by appuser).
#   3. Direct access/error logs to `/dev/stdout` and `/dev/stderr` (Docker standard).
#   4. Enable `sendfile on;` for zero-copy Linux kernel static asset delivery.
#   5. Omit legacy FastCGI, uWSGI, and SCGI temp paths (not used in this stack).
# ==============================================================================

# Automatically tune worker threads to available CPU cores
worker_processes auto;

# Place PID file in unprivileged /tmp directory owned by UID 10001
pid /tmp/nginx.pid;

# Stream error logs directly to container stderr
error_log /dev/stderr notice;

events {
  # Maximum concurrent network connections per worker process
  worker_connections 1024;
}

http {
  # Standard MIME type mappings (ensures browser receives correct Content-Type for JS/CSS)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Stream access logs directly to container stdout for Docker daemon capture
  access_log /dev/stdout;

  # Temporary buffer directories relocated to user-writable /tmp paths:
  # - client_body_temp_path: buffers incoming POST request bodies when payload exceeds buffer
  # - proxy_temp_path: buffers backend responses when response exceeds proxy buffer
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;

  # Zero-Copy Static File Delivery (`sendfile`):
  #   Invokes the Linux kernel `sendfile(2)` system call.
  #   Allows direct DMA transfer from disk page cache to network socket descriptors,
  #   eliminating redundant user-space buffer copies for static SPA assets (HTML, JS, CSS).
  sendfile on;

  # HTTP keep-alive timeout for persistent client-server connections
  keepalive_timeout 65;

  # Load the server block definition from conf.d (frontend/nginx.conf)
  include /etc/nginx/conf.d/*.conf;
}

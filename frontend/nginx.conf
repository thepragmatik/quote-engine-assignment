# ATTENTION(design): nginx serves the built SPA AND reverse-proxies /api/ to backend —
# same-origin by design (zero cross-origin browser requests). This is the mechanism
# satisfying MISSION_v2 §6's CORS-restriction clause; documented in ADR-005.
server {
  listen 3000;
  root /usr/share/nginx/html;

  # ATTENTION(security): browser security headers per MISSION_v2 §6
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # ATTENTION(resilience): do NOT buffer long fault-injection latencies away
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}

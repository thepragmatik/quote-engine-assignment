# ==============================================================================
# Nginx Server Configuration — Frontend Single-Page Application (SPA) Gateway
# ==============================================================================
#
# Scope & Role:
#   This configuration runs ONLY inside the `frontend` container.
#   The `backend` and `mock-vendor` containers run standalone Spring Boot embedded
#   Tomcat instances. Nginx acts as:
#     1. A high-performance static asset server for the built React/Vite SPA.
#     2. A same-origin reverse proxy for `/api/` requests routed to the backend.
#
# Same-Origin Architecture & CORS Elimination:
#   Because Nginx serves the UI on port 3000 and reverse-proxies `/api/` to
#   `http://backend:8000`, the browser communicates with `localhost:3000/api/...`.
#   From the browser's perspective, both the UI and the API share the same origin,
#   eliminating cross-origin preflight requests (OPTIONS) and protecting against
#   browser-side CORS configuration traps.
# ==============================================================================

server {
  # Listen on port 3000 as non-root UID 10001 (unprivileged ports must be > 1024)
  listen 3000;
  root /usr/share/nginx/html;

  # ----------------------------------------------------------------------------
  # Browser Security Headers (Architecture Specification §6)
  #
  # NOTE ON NGINX INHERITANCE:
  #   In Nginx, `add_header` directives declared at the `server` block level are
  #   INHERITED by child `location` blocks ONLY if the `location` block contains
  #   NO `add_header` directives of its own. Adding even one `add_header` inside
  #   a `location` block silently wipes out all server-level headers for that path.
  #   Keeping all security headers at the server level ensures global coverage.
  # ----------------------------------------------------------------------------

  # Content-Security-Policy (CSP):
  #   Restricts resource loading to trusted sources, mitigating Cross-Site Scripting (XSS).
  #   - default-src 'self': only load scripts, images, and fonts from our own origin.
  #   - style-src 'self' 'unsafe-inline': allows our Tailwind CSS utility styles.
  #   - connect-src 'self': restricts fetch/XHR calls strictly to our own origin.
  #   - frame-ancestors 'none': prevents clickjacking by barring this app from being iframe'd.
  #   - base-uri 'none' / form-action 'self': prevents base-tag injection and form redirection.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  # X-Frame-Options:
  #   Legacy clickjacking defense for older browsers that do not parse CSP frame-ancestors.
  add_header X-Frame-Options "DENY" always;

  # Strict-Transport-Security (HSTS):
  #   What is HSTS?
  #     HTTP Strict Transport Security (RFC 6797) instructs browsers to automatically
  #     rewrite all future `http://` requests to `https://` before sending them across
  #     the network, neutralizing SSL-stripping and man-in-the-middle (MITM) attacks.
  #   Why is max-age=31536000 such a large number?
  #     31,536,000 seconds = 60s * 60m * 24h * 365d = EXACTLY ONE YEAR.
  #     This is the standard minimum duration mandated by RFC 6797, OWASP guidelines,
  #     and the Chromium HSTS Preload list for production transport security.
  #   Transport Note:
  #     RFC 6797 §7.2 requires browsers to ignore HSTS when received over plain HTTP.
  #     In this local containerized MVP, it demonstrates production-grade header policy
  #     ready for upstream TLS termination (e.g. AWS ALB / Cloudflare).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # X-Content-Type-Options:
  #   Prevents MIME-type sniffing, stopping browsers from executing non-script files as scripts.
  add_header X-Content-Type-Options "nosniff" always;

  # Referrer-Policy:
  #   Sends the full referrer URL on same-origin requests, but only the domain on cross-origin HTTPS.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Permissions-Policy:
  #   Disables access to sensitive browser hardware APIs (camera, microphone, geolocation).
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ----------------------------------------------------------------------------
  # Payload & Request Limits
  # ----------------------------------------------------------------------------

  # Explicit body size cap (1MB) to guard against buffer exhaustion / oversized payload DoS.
  client_max_body_size 1m;

  # ----------------------------------------------------------------------------
  # Reverse Proxy: Backend API
  # ----------------------------------------------------------------------------
  location /api/ {
    # Edge Anti-Abuse Rate Limiting:
    #   Bounds burst traffic while allowing parallel load benchmarks (returns HTTP 429)
    limit_req zone=api_limit burst=250 nodelay;
    limit_req_status 429;

    # Forward upstream to the internal Docker service DNS hostname
    proxy_pass http://backend:8000;

    # Pass client identification & distributed tracing correlation IDs
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # Fault Tolerance Note:
    #   The upstream vendor simulation deliberately injects latency (e.g. 504 timeouts).
    #   A 30s read timeout ensures Nginx does not prematurely truncate in-flight retry chains.
    proxy_read_timeout 30s;
  }

  # ----------------------------------------------------------------------------
  # SPA Routing Fallback
  # ----------------------------------------------------------------------------
  location / {
    # If the requested URI exists as a static file, serve it; otherwise fall back
    # to index.html to allow client-side React Router to resolve the route.
    try_files $uri /index.html;
  }
}

# ATTENTION(design): nginx serves the built SPA AND reverse-proxies /api/ to backend —
# same-origin by design (zero cross-origin browser requests). This is the mechanism
# satisfying MISSION_v2 §6's CORS-restriction clause; documented in ADR-005.
server {
  listen 3000;
  root /usr/share/nginx/html;

  # ATTENTION(security): browser security headers per MISSION_v2 §6.
  # NOTE: add_header directives set at server level are INHERITED by a location only
  # while that location defines none of its own — never add a location-level
  # add_header here without re-stating all four (classic silent-drop trap).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  # HSTS is meaningless (and mildly harmful) over plain HTTP — meaningful when this
  # server is placed behind TLS; kept per spec §6 with this scope note.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Explicit body cap (default is 1M anyway — pin the intent)
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Forward proxy origin so the backend can distinguish direct vs proxied calls
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ATTENTION(resilience): do NOT buffer long fault-injection latencies away
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}

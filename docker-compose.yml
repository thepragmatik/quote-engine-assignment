# ATTENTION(config): all knobs externalized with defaults per MISSION_v2 ADR-003.
services:
  mock-vendor:
    build: { context: ./mock-vendor }
    ports: ["${PORT_VENDOR:-8001}:8001"]
    environment:
      - VENDOR_API_KEY=${VENDOR_API_KEY:-dev-vendor-secret}
      - FAULT_RATE=${FAULT_RATE:-0.2}
      - VENDOR_LATENCY_MIN_MS=${VENDOR_LATENCY_MIN_MS:-100}
      - VENDOR_LATENCY_MAX_MS=${VENDOR_LATENCY_MAX_MS:-2000}
    networks: [app-network]

  backend:
    build: { context: ./backend }
    ports: ["${PORT_BACKEND:-8000}:8000"]
    environment:
      - VENDOR_API_URL=http://mock-vendor:8001
      - VENDOR_API_KEY=${VENDOR_API_KEY:-dev-vendor-secret}
    depends_on: [mock-vendor]
    # ATTENTION(design): wget-based healthcheck (alpine has no curl; distroless has
    # neither — see ADR-005)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks: [app-network]

  frontend:
    build: { context: ./frontend }
    ports: ["${PORT_FRONTEND:-3000}:3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-network]

networks:
  app-network:
    driver: bridge
